id: dev.creeperkatze.full-steam-ahead
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: full-steam-ahead

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak

  - --filesystem=xdg-data/Steam:rw # Steam (native)
  - --filesystem=~/.steam:rw # Steam (native, legacy layout)
  - --filesystem=~/.var/app/com.valvesoftware.Steam:rw # Steam (Flatpak)
  - --filesystem=~/snap/steam/common/.local/share/Steam:rw # Steam (Snap)

  - --filesystem=~/.config/heroic:ro # Heroic (native)
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl:ro # Heroic (Flatpak)
  - --filesystem=xdg-data/lutris:ro # Lutris (native)
  - --filesystem=~/.var/app/net.lutris.Lutris:ro # Lutris (Flatpak)
  - --filesystem=~/.var/app/com.usebottles.bottles:ro # Bottles (Flatpak)
  - --filesystem=~/.config/legendary:ro # Legendary
  - --filesystem=~/.config/itch:ro # itch.io
  - --filesystem=~/GOG Games:ro # MiniGalaxy

modules:
  - name: full-steam-ahead
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin:/run/build/full-steam-ahead/pnpm
      env:
        CARGO_HOME: /run/build/full-steam-ahead/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/full-steam-ahead/flatpak-node/cache
    sources:
      - type: git
        url: https://github.com/creeperkatze/full-steam-ahead.git
        tag: v1.5.5
        commit: 80f50ac6a9e59f334c5ca6c9d2674d905edaef13
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          release-url-template: https://github.com/creeperkatze/full-steam-ahead/releases/tag/v$version
          is-main-source: true
      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.4.1.tgz
        sha256: 614d18bdcb121a844c0260b315d76b737e687346c001b8e093fd0a93202c2d6b
        dest: pnpm
        only-arches: [x86_64]
      - type: archive
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.4.1.tgz
        sha256: efd504b1fbea3461dda32204481137434557cfc1ed70ab03f0dc6f96dd2be845
        dest: pnpm
        only-arches: [aarch64]
      - cargo-sources.json
      - node-sources.json
      - type: file
        path: dev.creeperkatze.full-steam-ahead.metainfo.xml
    build-commands:
      - pnpm install --offline --frozen-lockfile --trust-lockfile
      - pnpm tauri build --bundles deb --features disable-auto-updates --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - install -Dm755 "src-tauri/target/release/Full Steam Ahead" /app/bin/full-steam-ahead
      - install -Dm644 src-tauri/target/release/bundle/deb/*/data/usr/share/applications/*.desktop
        /app/share/applications/dev.creeperkatze.full-steam-ahead.desktop
      - desktop-file-edit --set-key=Exec --set-value=full-steam-ahead --set-key=StartupWMClass
        --set-value=full-steam-ahead --set-icon=dev.creeperkatze.full-steam-ahead
        /app/share/applications/dev.creeperkatze.full-steam-ahead.desktop
      - install -Dm644 -t /app/share/metainfo/ dev.creeperkatze.full-steam-ahead.metainfo.xml
      - install -Dm644 src-tauri/icons/linux/icon.svg /app/share/icons/hicolor/scalable/apps/dev.creeperkatze.full-steam-ahead.svg
      - install -Dm644 -t /app/share/licenses/dev.creeperkatze.full-steam-ahead/ LICENSE
